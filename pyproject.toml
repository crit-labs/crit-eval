[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crit-eval"
version = "0.9.0"
description = "crit-eval: one speed, quality and exactness suite that every inference engine runs the same way"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# crit-core and crit-models at the versions crit's checkout declares: this crit-eval needs Core's eval adapter
# cohort with per-request sampling and output tokens (the concurrency runs, each prompt at its case's own length; the
# output tokens not in crit-core 0.24.0) and a decoder's mechanisms in crit-models (layer
# kinds, routed layers, the KV a token adds, the fixed state, which the limits read beside Core's generic fields),
# neither in a released crit-core. At a release both lower bounds are the release's version (crit-models first ships
# with it). No upper bound: crit pins the crit-eval it ships with, so a new crit-core release needs no crit-eval
# release.
dependencies = ["crit-core>=0.25.0", "crit-models>=0.25.0"]

[project.optional-dependencies]
# The reference scores the quality texts on the checkpoint itself (crit-eval reference).
reference = ["torch", "transformers>=5.20", "safetensors", "numpy"]

[project.urls]
Repository = "https://github.com/crit-labs/crit-eval"

[project.scripts]
crit-eval = "crit_eval.cli:main"

# The model-family knowledge crit-core reads through its registry (crit_core.registry), found without importing
# crit_eval: the GGUF config rules of the architectures the reference reads, and the chat templates crit ships.
[project.entry-points."crit_core.gguf_config"]
crit-eval = "crit_eval.architectures.gguf_config:CONFIG_RULES"

[project.entry-points."crit_core.chat_templates"]
crit-eval = "crit_eval.architectures:CHAT_TEMPLATES"

[tool.setuptools.packages.find]
include = ["crit_eval*"]

[tool.setuptools.package-data]
crit_eval = ["protocol.json", "suite/**/*", "probe/*", "examples/*", "workbench/harness.py", "architectures/templates/*.jinja"]
