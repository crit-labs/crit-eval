name: Tests

on:
  # A pull request's branch runs once (as the pull request), and a release tag reruns nothing main already ran.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels its older run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    # crit-eval's own tests on the CPU, with the oldest and the newest Python it supports. No runner has a GPU: the
    # tests that need one skip.
    name: ubuntu-24.04 / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      # One math thread: the tests' models are tiny, and torch's thread per core only costs.
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        # uv installs the same pinned wheels as pip, several times faster; its cache folder is kept between runs.
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.8
          echo "UV_CACHE_DIR=$RUNNER_TOOL_CACHE/uv-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.tool_cache }}/uv-cache
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install pinned runtime dependencies
        # The versions crit's CI installs (its .github/actions/setup): torch for the CPU, numpy, and one transformers
        # of the reference extra's range (the reference's tests compare with it).
        run: |
          python -m uv pip install --system tokenizers==0.23.3 jinja2==3.1.6 numpy==2.4.6 transformers==5.20.2
          python -m uv pip install --system torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install crit-core and crit-models from crit's repository, and crit-eval
        # pyproject.toml asks for crit-core and crit-models at the versions crit's checkout declares, which no release
        # may hold yet: both come from crit's main, as crit's CI takes crit-eval's main. A change here that needs a
        # change in crit passes once that change is on crit's main. While a release asks for a crit-core newer than
        # crit's main (crit's release goes on main only after this crit-eval is published, which crit's install
        # pins), they come from crit's release/X.Y.Z branch of the version asked for.
        run: |
          git clone --depth 1 https://github.com/crit-labs/crit ../crit
          wanted=$(python -c "import re, tomllib; d = tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(next(re.search(r'>=([0-9.]+)', x)[1] for x in d if x.startswith('crit-core')))")
          on_main=$(python -c "import pathlib, tomllib; p = next(f for f in map(pathlib.Path, ('../crit/inference/core/python/pyproject.toml', '../crit/core/python/pyproject.toml')) if f.is_file()); print(tomllib.load(p.open('rb'))['project']['version'])")
          if python -c "import sys; v = lambda s: tuple(map(int, s.split('.'))); sys.exit(v('$on_main') >= v('$wanted'))"; then
            echo "crit's main has crit-core $on_main, this crit-eval asks for $wanted: crit's release/$wanted"
            rm -rf ../crit && git clone --depth 1 --branch "release/$wanted" https://github.com/crit-labs/crit ../crit
          fi
          python -m uv pip install --system --no-deps -e ../crit/inference/core/python -e ../crit/models/core/python -e .
      - name: Tests
        run: cd tests && python -B -m unittest discover -s .
      - name: Verify source stayed unchanged
        run: git diff --exit-code
