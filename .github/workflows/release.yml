name: Release to PyPI

# A pushed vX.Y.Z tag builds crit-eval X.Y.Z and publishes it through PyPI trusted publishing (no token).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Tag, pyproject and crit_eval.__version__ agree
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          with open('pyproject.toml', 'rb') as f:
              project = tomllib.load(f)['project']['version']
          package = re.search(r'^__version__ = "([^"]+)"', open('crit_eval/__init__.py', encoding='utf-8').read(), re.M)[1]
          if not tag == project == package:
              raise SystemExit(f'tag {tag}, pyproject {project} and crit_eval.__version__ {package} differ')
          print(f'crit-eval {tag}')
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          python -B -c "from setuptools.build_meta import build_sdist, build_wheel; build_sdist('dist'); build_wheel('dist')"
          ls -l dist
      - name: Wheel installs and imports
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP" && python -B -c "import crit_eval, importlib.resources as r; print(crit_eval.__version__); assert r.files('crit_eval').joinpath('protocol.json').is_file()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/crit-eval/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
